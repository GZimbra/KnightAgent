[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knightagent"
version = "0.3.0"
description = "Agente de codigo local com Ollama"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "msal>=1,<2", "msal-extensions>=1,<2", "tomli>=2; python_version < '3.11'"]

[project.scripts]
knightagent = "knightagent.cli.main:main"
knightagent-gui = "knightagent.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knightagent.gui" = ["assets/*.png", "assets/*.ico"]
